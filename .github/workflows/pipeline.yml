name: Lab CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: lab-cicd-api
  EB_ENVIRONMENT: lab-cicd-api-env

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore LabCicdApi8.Tests/LabCicdApi8.Tests.csproj

      - name: Compilar
        run: dotnet build LabCicdApi8.csproj -c Release --no-restore

      - name: Rodar testes
        run: dotnet test LabCicdApi8.Tests/LabCicdApi8.Tests.csproj --no-restore --logger "console;verbosity=normal"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar aplicacao
        run: dotnet publish LabCicdApi8.csproj -c Release -r linux-x64 --no-self-contained -o ./staging

      - name: Copiar arquivos necessarios
        run: |
          cp Procfile ./staging/Procfile
          cp -r .ebextensions ./staging/.ebextensions

      - name: Criar zip para deploy
        run: cd staging && zip -r ../app.zip .

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::929514687054:role/github-actions-deploy
          aws-region: us-east-1

      - name: Deploy no Elastic Beanstalk
        run: |
          aws s3 cp app.zip s3://elasticbeanstalk-us-east-1-929514687054/lab-cicd-api/app-${{ github.sha }}.zip
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION }} \
            --version-label "v-${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-1-929